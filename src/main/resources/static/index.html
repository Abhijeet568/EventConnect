<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Chat Pro</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f2f6; height: 100vh; display: flex; justify-content: center; align-items: center; }

        #login-screen { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); z-index: 10; position: absolute;}
        .login-box { background: rgba(255, 255, 255, 0.9); padding: 30px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); text-align: center; width: 300px; }

        #app-container { display: none; width: 100%; height: 100vh; flex-direction: row; }

        .sidebar { width: 300px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; position: relative; }
        .sidebar-header { padding: 20px; background: #6c5ce7; color: white; text-align: center; font-weight: bold; font-size: 1.2em; }
        .room-list { flex-grow: 1; overflow-y: auto; padding: 10px; padding-bottom: 70px; }

        .room-item { padding: 15px; background: #f8f9fa; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .room-item:hover { background: #e0eaff; border-color: #6c5ce7; }
        .active-room { background: #6c5ce7 !important; color: white; }

        .delete-btn { background: none; border: none; cursor: pointer; opacity: 0.3; transition: 0.2s; font-size: 1.2em; }
        .room-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { transform: scale(1.2); color: red; }

        .create-room-container { position: absolute; bottom: 0; width: 100%; padding: 15px; background: white; border-top: 1px solid #ddd; box-sizing: border-box; }
        .create-room-btn { width: 100%; padding: 12px; border: 2px dashed #6c5ce7; background: #f1f2f6; color: #6c5ce7; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .create-room-btn:hover { background: #e0eaff; border-style: solid; }

        .chat-area { flex-grow: 1; display: flex; flex-direction: column; background: #f1f2f6; position: relative;}
        .chat-header { padding: 20px; background: white; border-bottom: 1px solid #ddd; font-weight: bold; font-size: 1.2em; color: #333; }
        .chat-box { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }

        .message { padding: 10px 15px; border-radius: 15px; width: fit-content; max-width: 70%; word-wrap: break-word; line-height: 1.4; position: relative; }
        .system-message { align-self: center; font-size: 0.85em; color: #666; background: #e2e2e2; padding: 5px 15px; border-radius: 20px; }
        .my-message { align-self: flex-end; background: #6c5ce7; color: white; border-bottom-right-radius: 2px; }
        .other-message { align-self: flex-start; background: white; color: #333; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .msg-tag { font-size: 0.7em; background: #ff7675; color: white; padding: 2px 6px; border-radius: 8px; margin-bottom: 4px; display: inline-block; }
        .msg-status { font-size: 0.75em; color: #a29bfe; margin-left: 10px; float: right; margin-top: 5px; }
        .other-message .msg-status { display: none; }

        .reply-btn { font-size: 0.75em; cursor: pointer; float: right; margin-left: 15px; opacity: 0.3; transition: 0.2s; background: rgba(0,0,0,0.1); padding: 2px 6px; border-radius: 5px;}
        .message:hover .reply-btn { opacity: 1; }
        .quoted-msg { background: rgba(0,0,0,0.1); padding: 6px 10px; border-left: 4px solid #a29bfe; border-radius: 5px; margin-bottom: 8px; font-size: 0.85em; opacity: 0.9; }
        .my-message .quoted-msg { background: rgba(255,255,255,0.2); border-left: 4px solid #fff; }

        .reply-banner { display: none; background: rgba(255,255,255,0.8); padding: 8px 15px; border-left: 4px solid #6c5ce7; border-radius: 10px; margin-bottom: 10px; font-size: 0.85em; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin: 0 20px;}
        .reply-banner .close-btn { position: absolute; right: 15px; top: 8px; cursor: pointer; font-weight: bold; color: #ff7675; }

        .emoji-bar { display: flex; gap: 10px; padding: 5px; justify-content: center; background: white; border-top: 1px solid #ddd;}
        .emoji { cursor: pointer; font-size: 1.2em; transition: transform 0.2s; }
        .emoji:hover { transform: scale(1.3); }

        .input-container { padding: 10px 20px 20px 20px; background: white; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        select { padding: 10px; border-radius: 10px; border: 1px solid #ddd; outline: none; cursor: pointer; }
        input[type="text"] { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 10px; outline: none; font-size: 16px;}
        button { padding: 12px 25px; border: none; border-radius: 10px; background: #6c5ce7; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #4834d4; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        .change-pwd-btn { background: #ff7675; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8em; float: right; }
        .change-pwd-btn:hover { background: #d63031; }
        .no-room-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:#f1f2f6; display:flex; justify-content:center; align-items:center; font-size: 1.5em; color: #888; z-index: 5;}

        /* Media */
        .msg-media { max-width: 100%; max-height: 250px; border-radius: 10px; margin-top: 5px; display: block; transition: 0.2s; }
        .msg-image { cursor: zoom-in; } /* Gives the magnifying glass icon on hover */
        .msg-image:hover { opacity: 0.9; }
        .msg-file { display: inline-block; background: rgba(0,0,0,0.1); padding: 8px 12px; border-radius: 8px; text-decoration: none; color: inherit; font-weight: bold; margin-top: 5px;}

        /* --- NEW: Full Screen Image Lightbox --- */
        .lightbox-modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .lightbox-content { margin: auto; display: block; max-width: 90%; max-height: 90%; position: relative; top: 50%; transform: translateY(-50%); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .lightbox-close { position: absolute; top: 20px; right: 35px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .lightbox-close:hover { color: #ff7675; }

        /* --- NEW: Right-Click Context Menu --- */
        .context-menu {
            display: none; position: absolute; z-index: 1000; background: white; border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; min-width: 200px; flex-direction: column;
        }
        .context-menu button { display: block; width: 100%; padding: 12px 15px; text-align: left; background: none; border: none; cursor: pointer; color: #333; font-weight: bold; border-radius: 0; font-size: 0.95em;}
        .context-menu button:hover { background: #f1f2f6; }
        .context-menu button.danger { color: #e74c3c; }

        /* Pop-Up Media Uploader Hover Menu */
        .attach-container { position: relative; display: flex; align-items: center; justify-content: center; }
        .attach-icon-trigger { cursor: pointer; font-size: 1.5em; padding: 5px; color: #666; transition: transform 0.2s, color 0.2s; }
        .attach-container:hover .attach-icon-trigger { color: #6c5ce7; transform: scale(1.1); }
        .attach-menu { position: absolute; bottom: 50px; left: -10px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.5); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; gap: 5px; opacity: 0; visibility: hidden; transform: translateY(15px); transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); width: max-content; z-index: 100; }
        .attach-container:hover .attach-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .attach-menu-item { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 10px 15px; border-radius: 10px; transition: background 0.2s; }
        .attach-menu-item:hover { background: #e0eaff; }
        .attach-menu-icon { font-size: 1.4em; }
        .attach-menu-text { font-size: 0.95em; font-weight: bold; color: #444; }
    </style>
</head>
<body>

<!-- Lightbox for Images -->
<div id="imageLightbox" class="lightbox-modal" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="expandedImg">
</div>

<!-- Right-Click Context Menu -->
<div id="customContextMenu" class="context-menu">
    <button onclick="executeDelete('me')">🗑️ Delete for me</button>
    <button class="danger" onclick="executeDelete('everyone')">🚫 Delete for everyone</button>
    <div style="height: 1px; background: #ddd; margin: 2px 0;"></div>
    <button onclick="closeContextMenu()">❌ Cancel</button>
</div>

<div id="login-screen">
    <div class="login-box">
        <h2>Welcome</h2>
        <input type="text" id="usernameInput" placeholder="Enter your username..." style="width: 90%; margin-bottom: 15px;" onkeypress="if(event.key === 'Enter') startApp()">
        <button onclick="startApp()" style="width: 100%;">Enter Chat</button>
    </div>
</div>

<div id="app-container">
    <div class="sidebar">
        <div class="sidebar-header" id="sidebarUserTitle">Rooms</div>
        <div class="room-list" id="roomListContainer"></div>

        <div class="create-room-container">
            <button class="create-room-btn" onclick="createNewRoom()">+ Create New Room</button>
        </div>
    </div>

    <div class="chat-area">
        <div id="noRoomOverlay" class="no-room-overlay">👈 Select a room to start chatting</div>
        <div class="chat-header" id="chatHeaderTitle">Room Name</div>
        <div class="chat-box" id="messages"></div>

        <div id="replyBanner" class="reply-banner">
            <span class="close-btn" onclick="cancelReply()">✕</span>
            <strong>Replying to <span id="replyBannerUser"></span>:</strong><br>
            <span id="replyBannerMsg" style="color: #666;"></span>
        </div>

        <div class="emoji-bar">
            <span class="emoji" onclick="addEmoji('😀')">😀</span>
            <span class="emoji" onclick="addEmoji('😂')">😂</span>
            <span class="emoji" onclick="addEmoji('❤️')">❤️</span>
            <span class="emoji" onclick="addEmoji('🔥')">🔥</span>
            <span class="emoji" onclick="addEmoji('👍')">👍</span>
            <span class="emoji" onclick="addEmoji('🙌')">🙌</span>
            <span class="emoji" onclick="addEmoji('🎉')">🎉</span>
        </div>

        <div class="input-container">
            <div class="input-row">

                <div class="attach-container" id="attachBtn" style="pointer-events: none; opacity: 0.5;">
                    <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload()">
                    <div class="attach-menu">
                        <label for="fileInput" class="attach-menu-item">
                            <span class="attach-menu-icon">🖼️</span>
                            <span class="attach-menu-text">Media Uploader</span>
                        </label>
                    </div>
                    <div class="attach-icon-trigger">📎</div>
                </div>

                <select id="tagSelect" disabled>
                    <option value="">No Tag</option>
                    <option value="Urgent">🚨 Urgent</option>
                    <option value="Question">❓ Question</option>
                </select>
                <input type="text" id="messageText" autocomplete="off" placeholder="Type a message..." onkeypress="handleKeyPress(event)" disabled>
                <button onclick="sendMessage()" id="sendBtn" disabled>Send</button>
            </div>
        </div>
    </div>
</div>

<script>
    let ws;
    let currentUser;
    let currentRoomId;
    let currentReplyUser = "";
    let currentReplyMsg = "";

    // Context Menu Variables
    let msgToDeleteId = null;

    // --- NEW: Context Menu Logic ---
    function showContextMenu(event, messageId) {
        event.preventDefault(); // Stop normal right-click menu
        msgToDeleteId = messageId;
        let menu = document.getElementById("customContextMenu");
        menu.style.display = "flex";

        // Prevent menu from going off-screen
        let x = event.pageX;
        let y = event.pageY;
        if (x + 200 > window.innerWidth) x = window.innerWidth - 210;
        if (y + 150 > window.innerHeight) y = window.innerHeight - 160;

        menu.style.left = x + "px";
        menu.style.top = y + "px";
    }

    function closeContextMenu() {
        document.getElementById("customContextMenu").style.display = "none";
        msgToDeleteId = null;
    }

    // Hide context menu when clicking anywhere else
    document.addEventListener("click", function(e) {
        if (e.target.closest('#customContextMenu') === null) {
            closeContextMenu();
        }
    });

    function executeDelete(type) {
        if (!msgToDeleteId) return;
        if (type === 'me') {
            document.getElementById('msg-box-' + msgToDeleteId).style.display = 'none';
        } else if (type === 'everyone') {
            if (ws && confirm("Are you sure you want to delete this message for everyone?")) {
                ws.send(JSON.stringify({ type: "DELETE", messageId: msgToDeleteId }));
            }
        }
        closeContextMenu();
    }

    // --- NEW: Lightbox Logic ---
    function openLightbox(src) {
        document.getElementById('expandedImg').src = src;
        document.getElementById('imageLightbox').style.display = "block";
    }
    function closeLightbox() {
        document.getElementById('imageLightbox').style.display = "none";
        document.getElementById('expandedImg').src = "";
    }

    // Original Chat Logic below...
    function addEmoji(emoji) {
        let input = document.getElementById("messageText");
        input.value += emoji;
        input.focus();
    }

    function startApp() {
        let input = document.getElementById("usernameInput").value.trim();
        if (!input) { alert("Please enter a username."); return; }
        currentUser = input;
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("app-container").style.display = "flex";
        document.getElementById("sidebarUserTitle").innerText = "Logged in as: " + currentUser;
        loadRooms();
    }

    async function handleFileUpload() {
        let fileInput = document.getElementById("fileInput");
        if (fileInput.files.length === 0) return;

        let file = fileInput.files[0];
        let formData = new FormData();
        formData.append("file", file);

        let fileType = "file";
        if (file.type.startsWith("image/")) fileType = "image";
        else if (file.type.startsWith("video/")) fileType = "video";

        let response = await fetch('/api/files/upload', { method: 'POST', body: formData });
        let fileUrl = await response.text();

        if (fileUrl !== "UPLOAD_FAILED" && ws && ws.readyState === WebSocket.OPEN) {
            let messageObj = { content: "Shared a " + fileType, tag: "", fileUrl: fileUrl, fileType: fileType };
            ws.send(JSON.stringify(messageObj));
        } else {
            alert("File upload failed!");
        }
        fileInput.value = "";
    }

    async function deleteRoom(event, roomId, roomName) {
        event.stopPropagation();
        if(!confirm(`⚠️ WARNING: Are you sure you want to PERMANENTLY delete '${roomName}' and all its messages?`)) { return; }
        let response = await fetch(`/api/rooms/${roomId}`, { method: 'DELETE' });

        if (response.ok) {
            if (currentRoomId == roomId) {
                if (ws) { ws.close(); }
                document.getElementById("noRoomOverlay").style.display = "flex";
                document.getElementById("chatHeaderTitle").innerHTML = "Room Deleted";
                document.getElementById("messages").innerHTML = "";
                document.getElementById("messageText").disabled = true;
                document.getElementById("sendBtn").disabled = true;
                document.getElementById("tagSelect").disabled = true;
                document.getElementById("attachBtn").style.pointerEvents = "none";
                document.getElementById("attachBtn").style.opacity = "0.5";
            }
            loadRooms();
        } else {
            alert("❌ Failed to delete the room.");
        }
    }

    async function createNewRoom() {
        let name = prompt("Enter a name for the new chat room:");
        if (!name || name.trim() === "") return;

        let isPrivate = confirm("Should this room be private? \n\nClick [OK] for Private (Requires Password)\nClick [Cancel] for Public");
        let password = "";
        if (isPrivate) {
            password = prompt("Enter a password for this private room:");
            if (!password || password.trim() === "") {
                alert("Private rooms MUST have a password. Creation cancelled.");
                return;
            }
        }

        let response = await fetch('/api/rooms/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name.trim(), isPrivate: isPrivate.toString(), password: password })
        });

        if (response.ok) { loadRooms(); }
        else { alert("❌ Failed to create the room."); }
    }

    async function loadRooms() {
        try {
            let response = await fetch('/api/rooms');
            let rooms = await response.json();
            let container = document.getElementById("roomListContainer");
            container.innerHTML = "";

            rooms.forEach(room => {
                let div = document.createElement("div");
                div.className = "room-item";
                div.id = "room-item-" + room.id;

                let icon = room.isPrivate === "true" ? "🔒" : "💬";
                div.innerHTML = `
                    <span>${icon} ${room.name}</span>
                    <button class="delete-btn" onclick="deleteRoom(event, ${room.id}, '${room.name}')">🗑️</button>
                `;
                div.onclick = () => attemptJoinRoom(room.id, room.name, room.isPrivate);
                container.appendChild(div);
            });

            if (currentRoomId) {
                let activeEl = document.getElementById("room-item-" + currentRoomId);
                if(activeEl) activeEl.classList.add('active-room');
            }
        } catch (error) { console.error("Failed to load rooms", error); }
    }

    async function attemptJoinRoom(roomId, roomName, isPrivate) {
        let password = "";
        if (isPrivate === "true") {
            password = prompt(`The room '${roomName}' is restricted. Enter password:`);
            if (password === null) return;
        }

        let response = await fetch('/api/rooms/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ roomId: roomId, password: password })
        });

        let isAuthorized = await response.json();
        if (isAuthorized) { connectToChat(roomId, roomName, isPrivate); }
        else { alert("❌ Incorrect password. Access denied."); }
    }

    async function changeRoomPassword(roomId) {
        let oldPassword = prompt("For security, enter the CURRENT password:");
        if (!oldPassword) return;
        let newPassword = prompt("Enter the NEW password:");
        if (!newPassword) return;

        let response = await fetch('/api/rooms/update-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ roomId: roomId.toString(), oldPassword: oldPassword, newPassword: newPassword })
        });

        let success = await response.json();
        if (success) { alert("✅ Password updated successfully!"); }
        else { alert("❌ Failed to update. Incorrect current password."); }
    }

    function startReply(user, msg) {
        currentReplyUser = user;
        currentReplyMsg = msg.length > 50 ? msg.substring(0, 50) + "..." : msg;
        document.getElementById("replyBannerUser").innerText = currentReplyUser;
        document.getElementById("replyBannerMsg").innerText = currentReplyMsg;
        document.getElementById("replyBanner").style.display = "block";
        document.getElementById("messageText").focus();
    }

    function cancelReply() {
        currentReplyUser = ""; currentReplyMsg = "";
        document.getElementById("replyBanner").style.display = "none";
    }

    function connectToChat(roomId, roomName, isPrivate) {
        if (ws) { ws.close(); }
        currentRoomId = roomId;

        document.getElementById("noRoomOverlay").style.display = "none";

        let headerHtml = roomName;
        if (isPrivate === "true" || isPrivate === true) {
            headerHtml += ` <button class="change-pwd-btn" onclick="changeRoomPassword(${roomId})">🔑 Change Password</button>`;
        }
        document.getElementById("chatHeaderTitle").innerHTML = headerHtml;

        document.getElementById("messages").innerHTML = "";

        document.getElementById("messageText").disabled = false;
        document.getElementById("sendBtn").disabled = false;
        document.getElementById("tagSelect").disabled = false;
        let attachBtn = document.getElementById("attachBtn");
        attachBtn.style.pointerEvents = "auto";
        attachBtn.style.opacity = "1";

        document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active-room'));
        document.getElementById("room-item-" + roomId).classList.add('active-room');

        let protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        let host = window.location.host;
        if (host.includes("63342")) { host = "localhost:8080"; }

        ws = new WebSocket(`${protocol}://${host}/ws/${roomId}/${currentUser}`);

        ws.onmessage = function(event) {
            let data = JSON.parse(event.data);

            if (data.type === "DELETE_UPDATE") {
                let bubble = document.getElementById("msg-content-" + data.id);
                if (bubble) bubble.innerHTML = data.content;
                return;
            }

            let messages = document.getElementById('messages');
            let messageDiv = document.createElement('div');
            messageDiv.id = "msg-box-" + data.id;

            if (data.type === "SYSTEM") {
                messageDiv.className = "message system-message";
                messageDiv.innerText = data.content;
            } else {
                let isMe = (data.sender === currentUser);
                messageDiv.className = isMe ? "message my-message" : "message other-message";

                // --- Attach Context Menu Event ONLY to your own messages ---
                if (isMe && !data.isDeleted) {
                    messageDiv.oncontextmenu = function(e) { showContextMenu(e, data.id); };
                }

                let htmlContent = "";

                if (data.replyToUser && data.replyToUser !== "") {
                    htmlContent += `<div class="quoted-msg"><strong>Replying to ${data.replyToUser}:</strong><br>${data.replyToMessage}</div>`;
                }
                if (!isMe) { htmlContent += `<strong>${data.sender}</strong><br>`; }
                if (data.tag !== "") { htmlContent += `<span class="msg-tag">${data.tag}</span><br>`; }

                htmlContent += `<span id="msg-content-${data.id}">${data.content}</span>`;

                // --- Render Media with Lightbox Click ---
                if (data.fileUrl && !data.isDeleted) {
                    if (data.fileType === "image") {
                        htmlContent += `<br><img src="${data.fileUrl}" class="msg-media msg-image" onclick="openLightbox('${data.fileUrl}')">`;
                    } else if (data.fileType === "video") {
                        htmlContent += `<br><video src="${data.fileUrl}" class="msg-media" controls></video>`;
                    } else {
                        htmlContent += `<br><a href="${data.fileUrl}" class="msg-file" target="_blank">📄 Download File</a>`;
                    }
                }

                htmlContent += `<span class="msg-status">${data.status}</span>`;

                let safeMsg = data.content.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                htmlContent += `<span class="reply-btn" onclick="startReply('${data.sender}', '${safeMsg}')">↩️ Reply</span>`;

                messageDiv.innerHTML = htmlContent;
            }

            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        };
    }

    function sendMessage() {
        let input = document.getElementById("messageText");
        let tagSelector = document.getElementById("tagSelect");

        if (input.value.trim() !== "" && ws && ws.readyState === WebSocket.OPEN) {
            let messageObj = {
                content: input.value.trim(), tag: tagSelector.value,
                replyToUser: currentReplyUser, replyToMessage: currentReplyMsg
            };
            ws.send(JSON.stringify(messageObj));
            input.value = ''; tagSelector.value = ""; cancelReply();
        }
    }

    function handleKeyPress(event) { if (event.key === "Enter") { sendMessage(); } }
</script>
</body>
</html>
